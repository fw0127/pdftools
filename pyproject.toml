[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftools"
version = "0.1.0"
description = "PDF <-> EPUB converter for macOS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24", "ebooklib>=0.18"]

[project.scripts]
pdfepub = "pdftools.cli:main"

[tool.setuptools]
packages = ["pdftools"]
